<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
</head>
<body>
    <h1>Products</h1>
    {% if products %}
        <ul>
            {% for product in products %}
                <li>{{ product.name }} - {{ product.unit_price }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No products yet.</p>
    {% endif %}
</body>
</html>
