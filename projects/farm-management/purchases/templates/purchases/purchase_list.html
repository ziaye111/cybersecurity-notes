<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchases</title>
</head>
<body>
    <h1>Purchases</h1>
    {% if purchases %}
        <ul>
            {% for purchase in purchases %}
                <li>{{ purchase.invoice_number }} - {{ purchase.supplier.name }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No purchases yet.</p>
    {% endif %}
</body>
</html>
