<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses</title>
</head>
<body>
    <h1>Expenses</h1>
    {% if expenses %}
        <ul>
            {% for expense in expenses %}
                <li>{{ expense.title }} - {{ expense.amount }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No expenses yet.</p>
    {% endif %}
</body>
</html>
