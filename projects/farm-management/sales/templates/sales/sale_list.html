<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales</title>
</head>
<body>
    <h1>Sales</h1>
    {% if sales %}
        <ul>
            {% for sale in sales %}
                <li>{{ sale.invoice_number }} - {{ sale.customer.name }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No sales yet.</p>
    {% endif %}
</body>
</html>
