<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livestock</title>
</head>
<body>
    <h1>Livestock Records</h1>
    {% if records %}
        <ul>
            {% for record in records %}
                <li>{{ record.breed }} {{ record.animal_type }} - {{ record.status }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No livestock yet.</p>
    {% endif %}
</body>
</html>
