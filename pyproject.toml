[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scopeguard"
version = "0.1.0"
description = "Authorization-first security posture checks for web targets"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Abdullatif Ziaye"}]
license = {text = "MIT"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
scopeguard = "scopeguard.cli:main"

[tool.setuptools.packages.find]
include = ["scopeguard*"]

